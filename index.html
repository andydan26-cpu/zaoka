<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="灶跤人生">
<meta name="theme-color" content="#2f4a43">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="icon-192.png">
<title>灶跤人生</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=LXGW+WenKai+TC:wght@400;700&family=Noto+Sans+TC:wght@400;500;700&display=swap">
<style>
/* 老店風：鐵窗綠 + 紅燈籠 + 磨石子；單一暖色主題（刻意不做深色版） */
:root{
  --wall:#2f4a43;      /* 鐵窗綠 */
  --wall-2:#3c5c53;
  --paper:#f3ead8;     /* 菜單紙 */
  --ink:#2a2420;
  --ink-soft:#6b5d50;
  --red:#c2412d;       /* 紅燈籠 */
  --gold:#d9a441;
  --ok:#3f8f5a;
  --warn:#d08a24;
  --bad:#b8352a;
  --line:#d8c9ad;
  --f-display:"LXGW WenKai TC","Noto Serif TC","PingFang TC","Microsoft JhengHei",serif;
  --f-body:"Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,sans-serif;
  color-scheme:dark;
}
html,body{height:100%}
body{margin:0;background:var(--wall);color:var(--paper);font-family:var(--f-body);
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  padding-block:8px;box-sizing:border-box;overflow:hidden;-webkit-user-select:none;user-select:none;touch-action:none}
#app{position:relative;height:100%;display:flex;flex-direction:column;gap:6px;max-width:1400px;margin:0 auto}
#hud{display:flex;flex-wrap:wrap;align-items:center;gap:6px 14px;font-size:13px;font-variant-numeric:tabular-nums}
#hud .brand{font-family:var(--f-display);font-size:20px;font-weight:700;color:var(--gold);letter-spacing:.06em}
.chip{display:inline-flex;align-items:center;gap:4px;background:var(--wall-2);padding:3px 9px;border-radius:999px}
.chip b{font-weight:700;color:#fff}
.chip.low{background:var(--bad);animation:blink 1s infinite}
@keyframes blink{50%{opacity:.55}}
#timer{font-family:var(--f-display);font-size:18px;color:#fff}
#stageWrap{flex:1;min-height:0;display:flex;align-items:center;justify-content:center;position:relative}
#stage{position:relative;width:100%;height:100%}
canvas{display:block;width:100%;height:100%;border-radius:10px;box-shadow:0 6px 24px #0006;touch-action:none}
#bar{display:flex;gap:8px;align-items:stretch;overflow-x:auto;padding-bottom:2px}
.card{flex:0 0 auto;background:var(--paper);color:var(--ink);border-radius:8px;padding:5px 9px;min-width:118px;cursor:pointer;border:2px solid transparent;font-size:12px}
.card.sel{border-color:var(--red)}
.card .nm{font-weight:700;font-size:13px;display:flex;justify-content:space-between;gap:6px}
.meter{height:5px;background:#0001;border-radius:3px;overflow:hidden;margin-top:3px}
.meter i{display:block;height:100%}
.btn{font-family:var(--f-body);font-size:14px;font-weight:700;border:0;border-radius:8px;padding:8px 14px;cursor:pointer;background:var(--red);color:#fff}
.btn:focus-visible,.card:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
.btn.ghost{background:transparent;color:inherit;border:1.5px solid currentColor}
.btn.sm{padding:4px 9px;font-size:12px}
.btn:disabled{opacity:.4;cursor:not-allowed}
#overlay{position:fixed;inset:0;background:#1d2b27e6;display:flex;align-items:center;justify-content:center;z-index:20;
  padding:max(12px,env(safe-area-inset-top,0px)) max(12px,env(safe-area-inset-right,0px)) max(12px,env(safe-area-inset-bottom,0px)) max(12px,env(safe-area-inset-left,0px))}
#panel{background:var(--paper);color:var(--ink);border-radius:12px;max-width:920px;width:100%;max-height:100%;overflow:auto;padding:18px 20px;box-sizing:border-box;touch-action:pan-y;-webkit-user-select:text;user-select:text}
#panel h1,#panel h2{font-family:var(--f-display);margin:0;text-wrap:balance}
#panel h1{font-size:30px;color:var(--red)}
#panel h2{font-size:19px;margin-top:14px;margin-bottom:6px;border-bottom:2px solid var(--line);padding-bottom:3px}
#panel p{line-height:1.65;margin:6px 0;max-width:65ch}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:8px}
.box{background:#fff8;border:1px solid var(--line);border-radius:8px;padding:8px 10px;min-width:0;font-size:13px}
.row{display:flex;align-items:center;justify-content:space-between;gap:8px}
.stats{display:flex;flex-wrap:wrap;gap:8px 18px;font-variant-numeric:tabular-nums}
.stats div b{font-size:20px;font-family:var(--f-display);display:block}
.pos{color:var(--ok)}.neg{color:var(--bad)}
select{font-family:var(--f-body);font-size:13px;padding:3px;border-radius:6px;border:1px solid var(--line);background:#fff;color:var(--ink)}
.tag{display:inline-block;font-size:11px;background:var(--wall);color:var(--paper);padding:1px 6px;border-radius:4px;margin:1px}
.small{font-size:12px;color:var(--ink-soft)}
.foot{display:flex;flex-wrap:wrap;gap:10px;justify-content:flex-end;margin-top:14px;position:sticky;bottom:-18px;background:var(--paper);padding:10px 0}
#tut{position:absolute;left:50%;transform:translateX(-50%);top:8px;pointer-events:none;width:min(620px,calc(100% - 24px));display:none;gap:10px;align-items:flex-end;z-index:6;
  background:#f3ead8;color:#2a2420;border:3px solid #c2412d;border-radius:14px;padding:8px 12px 10px 8px;box-shadow:0 6px 20px #0006;box-sizing:border-box}
#tut img{width:64px;height:auto;flex:0 0 auto}
#tut .tx{flex:1;min-width:0}
#tut b{color:#c2412d;font-size:15px}
#tut p{margin:2px 0 6px;font-size:14px;line-height:1.55}
#tut button{pointer-events:auto}
#tut .tb{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
@media (max-height:560px),(max-width:820px){#tut{top:4px;padding:5px 8px;gap:6px}#tut img{width:40px}#tut p{font-size:12px;line-height:1.4;margin:1px 0 4px}#tut b{font-size:12px}}
#toast{position:absolute;left:50%;top:10px;transform:translateX(-50%);background:var(--ink);color:var(--paper);padding:6px 14px;border-radius:999px;font-size:13px;pointer-events:none;opacity:0;transition:opacity .3s;white-space:nowrap}
#joy{position:absolute;left:12px;bottom:12px;width:110px;height:110px;border-radius:50%;background:#fff2;border:2px solid #fff5;display:none;touch-action:none}
#joy i{position:absolute;left:35px;top:35px;width:40px;height:40px;border-radius:50%;background:#fff9}
@media (pointer:coarse){#joy{display:block}}
#rot{display:none}
@media (orientation:portrait) and (max-width:700px){#rot{display:block;font-size:12px;text-align:center;color:var(--gold)}}
@media (prefers-reduced-motion:reduce){.chip.low{animation:none}}
.mob{display:none}
@media (max-height:560px),(max-width:820px){
  body{padding-block:4px}
  #app{gap:4px}
  body{padding-left:env(safe-area-inset-left,0px);padding-right:env(safe-area-inset-right,0px);padding-block:0}
  #app{gap:0}
  canvas{border-radius:0;box-shadow:none}
  #hud{position:absolute;z-index:5;right:6px;bottom:6px;left:118px;flex-wrap:nowrap;overflow-x:auto;font-size:11px;gap:4px 6px;scrollbar-width:none;
    background:#1d2b27cc;border-radius:12px;padding:4px 6px}
  #hud::-webkit-scrollbar{display:none}
  #hud .brand,#hStock,#rot{display:none!important}
  .chip{padding:2px 7px;flex:0 0 auto}
  #timer{font-size:15px;flex:0 0 auto}
  #hud .btn{flex:0 0 auto}
  .mob{display:inline-block}
  #bar{display:none}
  body.showbar #bar{display:flex}
  .card{min-width:104px;padding:3px 7px}
  #joy{width:96px;height:96px;left:8px;bottom:8px}
  #joy i{left:28px;top:28px}
}
body.rot90 #app,body.rot90 #overlay{position:fixed;top:0;left:0;margin:0;max-width:none;width:var(--rh,100vh);height:var(--rw,100vw);
  transform-origin:0 0;transform:translateX(var(--rw,100vw)) rotate(90deg);box-sizing:border-box}
body.rot90 #overlay{inset:auto}
body.rot90 #rot{display:none!important}
body.rot90{padding:0}
@media (max-height:300px){
  #hud{font-size:9px;padding:2px 4px;gap:3px;left:74px;bottom:3px;right:3px}
  #hud .btn.sm{padding:2px 6px;font-size:10px}
  #timer{font-size:12px}
  .chip{padding:1px 5px}
  #joy{width:64px;height:64px;left:4px;bottom:4px}
  #joy i{left:17px;top:17px;width:28px;height:28px}
}
</style>

</head>
<body>
<div id="app">
  <div id="hud">
    <span class="brand">灶跤人生</span>
    <span class="chip" id="hDay">第 1 天・午餐</span>
    <span id="timer">3:00</span>
    <span class="chip"><img id="coinIc" alt="" style="height:16px;width:auto">現金 <b id="hCash">0</b></span>
    <span class="chip">本場 <b id="hRev">0</b></span>
    <span class="chip">★ <b id="hStar">3.0</b></span>
    <span class="chip" id="hPlate">乾淨盤 <b>0</b></span>
    <span id="hStock" style="display:flex;gap:4px;flex-wrap:wrap"></span>
    <span style="flex:1"></span>
    <button class="btn sm ghost" id="bZoom" title="切換跟隨鏡頭／全店畫面">🔍 鏡頭</button>
    <button class="btn sm ghost mob" id="bStaff">👥 員工</button>
    <button class="btn sm ghost" id="bFull">⛶ 全螢幕</button>
    <button class="btn sm ghost" id="bOrder">緊急叫貨</button>
    <button class="btn sm" id="bPause">暫停</button>
  </div>
  <div id="rot">手機請轉橫向遊玩</div>
  <div id="stageWrap"><div id="stage">
    <canvas id="cv" aria-label="餐廳營業畫面"></canvas>
    <div id="joy"><i></i></div>
    <div id="toast"></div>
    <div id="tut"></div>
  </div></div>
  <div id="bar"></div>
</div>
<div id="overlay"><div id="panel"></div></div>

function spotAt(p){for(const k in SPOTS){if(!owned(k))continue;const s=SPOTS[k];if(Math.hypot(p.x-s.x,p.y-s.y)<s.r)return k}return null}
function bossClaims(){const b=R.boss,set=new Set();if(R.bossSpot)set.add(R.bossSpot);if(R.boss2){if(R.boss2Spot)set.add(R.boss2Spot);if(R.boss2.tx!=null){const d2=spotAt({x:R.boss2.tx,y:R.boss2.ty});if(d2)set.add(d2)}}if(b.tx!=null){const d=spotAt({x:b.tx,y:b.ty});if(d)set.add(d)}return set}
const bossAt=k=>(R.bossSpot===k&&!R.boss.carry)||(!!R.boss2&&R.boss2Spot===k&&!R.boss2.carry);
const curSt=s=>s.rt&&s.rt.brk?null:s.rt&&s.rt.cst!==undefined?s.rt.cst:s.role==='prep'?s.rt.pst:STOVES.includes(s.role)?(s.rt.help||s.role):s.role==='clean'?'sink':null;
function crewOf(k){return G.staff.filter(s=>s.rt&&curSt(s)===k)}
function stationWorkers(st){
  const out=crewOf(st).filter(s=>s.rt.there&&s.rt.slot>=0&&s.rt.slack<=0&&s.stam>0).map(s=>({p:s,boss:false}));
  if(R.bossSpot===st&&!R.boss.carry)out.unshift({p:G.boss,boss:true});
  if(R.boss2&&R.boss2Spot===st&&!R.boss2.carry)out.unshift({p:G.boss2||G.boss,boss:true});
  return out;
}
function headTicket(st){return R.tickets.find(t=>t.st==='queued'&&t.steps[t.si]===st)}

function update(dt){
  R.t+=TUT?0:dt;
  if(R.battle)battleTick(dt);
  mealEvTick(dt); tutTick(); comboTick(dt);
  const PWR=(R.battle&&R.battle.deb.power>0)||R.ev.power>0, WTR=(R.battle&&R.battle.deb.water>0)||R.ev.water>0;
  while(R.spawns.length&&R.spawns[0]<=R.t){R.spawns.shift();if(R.closed)R.skipped=(R.skipped||0)+1;else spawnGroup()}
  // 老闆
  moveBoss(dt);
  moveBoss2(dt);
  R.bossSpot=spotAt(R.boss); R.boss2Spot=R.boss2?spotAt(R.boss2):null; R.claims=bossClaims();
  if(R.bossSpot==='door'&&R.prevSpot!=='door'&&!(R.ev&&R.ev.power>0)){R.closed=!R.closed;
    fx(SPOTS.door.x+40,SPOTS.door.y-70,R.closed?'暫停收客':'恢復營業',R.closed?'#c2412d':'#3d8b5a');
    toast(R.closed?'門口掛上「暫停收客」，店裡的客人照常服務':'招牌翻回「營業中」，客人又會進來了',2.5)}
  R.prevSpot=R.bossSpot;
  if(R.boss2){if(R.boss2Spot==='door'&&R.prevSpot2!=='door'&&!(R.ev&&R.ev.power>0)){R.closed=!R.closed;toast((R.boss2.nm||'夥伴')+(R.closed?' 掛上了暫停收客':' 把招牌翻回營業中'),2.5)}R.prevSpot2=R.boss2Spot}
  bossActions(dt);
  // 每個崗位最多 3 人（老闆在的話先佔一位）
  R.plan=prepPlan();
  G.staff.forEach(s=>{if(!s.rt)return;
    if(s.role==='prep')s.rt.pst=choosePrepStation(s,s.rt.pst)||s.rt.pst||'cut';
    else if(STOVES.includes(s.role)){const k=s.role,busy=headTicket(k)||R.tickets.some(t=>(t.st==='moving'||t.st==='cutCarry')&&t.steps[t.si]===k)||trayItems().some(t=>t.steps[0]===k)||s.rt.carry||s.rt.fetch;
      if(busy){s.rt.help=null;return}
      const other=STOVES.find(k2=>k2!==k&&owned(k2)&&headTicket(k2)&&!bossAt(k2)&&!G.staff.some(x=>x!==s&&x.role===k2&&x.stam>0));
      s.rt.help=other||(PREP.some(canJob)?choosePrepStation(s,PREP.includes(s.rt.help)?s.rt.help:null):null)}});
  for(const k of KITCHEN){
    const list=crewOf(k).sort((a,b)=>a.id-b.id), cap=CAP-(bossAt(k)?1:0);
    list.forEach((s,i)=>{s.rt.slot=i<cap?i:-1;s.rt.wait=i-cap})}
  // 員工
  for(const s of G.staff){
    const rt=s.rt; if(s.role==='rest'||TUT)continue;
    if(rt.brk){const i=G.staff.filter(x=>x.rt&&x.rt.brk).indexOf(s);walk(rt,{x:560-i*34,y:612},110,dt);rt.there=false;
      s.stam=Math.min(100,s.stam+dt*2.5);s.mood=Math.min(100,s.mood+dt*.35);continue}
    s.stam=Math.max(0,s.stam-dt*(s.traits.includes('勤勞')?.075:s.traits.includes('愛偷懶')?.06:.1));
    if(s.stam<=0){rt.slack=1;continue}
    if(rt.slack>0){rt.slack-=dt;continue}
    if(s.mood<40&&s.mood>=1&&Math.random()<dt*(s.traits.includes('愛偷懶')?.08:.04)){rt.slack=3;continue}
    if(STOVES.includes(s.role)||s.role==='clean'||s.role==='prep'){
      if(carrierAI(s,dt)){rt.there=false;continue}
      if(s.role==='prep'&&(rt.goShelf||(rt.carry&&rt.carry.basket)||(!G.staff.some(x=>x.role==='stock')&&!PREP.some(canJob)&&neededIng()&&s===G.staff.find(x=>x.role==='prep')))){stockAI(s,dt);rt.there=false;continue}
      const it=s.role!=='clean'&&pickTray(s); if(it){it.res=s;rt.fetch=it;rt.there=false;continue}
      const sp=SPOTS[curSt(s)];
      const tg=rt.slot>=0?{x:sp.x+SLOT[rt.slot][0],y:sp.y+SLOT[rt.slot][1]}:{x:sp.x-20+rt.wait*16,y:sp.y+48};
      rt.there=walk(rt,tg,120,dt)&&rt.slot>=0;
    } else if(s.role==='stock'){ if(!stockAI(s,dt))walk(rt,{x:SPOTS.shelf.x-60,y:SPOTS.shelf.y+40},120,dt); }
    else floorAI(s,dt);
  }
  // 備料區：洗、切、打蛋、煮飯、醃
  for(const st of PREP){if(PWR||(WTR&&st==='wash'))continue;const S=R.ps[st], ws=stationWorkers(st);
    let job=S.job&&JOBS[st].find(j=>j[0]===S.job);
    if(!job||!job[2](R.plan)){job=JOBS[st].find(j=>j[2](R.plan));S.job=job?job[0]:null;S.p=0}
    S.name=job?job[4]:null;
    if(!job||!ws.length)continue;
    S.p+=dt/job[1]*ws.reduce((a,w)=>a+workerFactor(w.p,'prep',w.boss),0);
    if(S.p>=1){S.p=0;const best=ws.reduce((a,w)=>w.p.abil.prep>a.p.abil.prep?w:a,ws[0]);
      if(st==='cut'&&Math.random()<errChance(best.p,'prep',best.boss)){fx(ST.cut.x,ST.cut.y-40,'切歪了！','#b8352a');R.fx.push({x:ST.cut.x,y:ST.cut.y-20,img:'smoke',t:1});continue}
      job[3](R.plan);G.pq=G.pq*.8+best.p.abil.prep*.2;ws.forEach(w=>grow(w.p,'prep',.3));R.plan=prepPlan();}
  }
  // 醃料盆、電鍋計時
  if(G.mar.length){G.mar=G.mar.map(t=>t-dt);const d=G.mar.filter(t=>t<=0).length;if(d){G.ready.meat_mar+=d;G.mar=G.mar.filter(t=>t>0);fx(ST.mar.x,ST.mar.y-40,'醃好了','#3f8f5a')}}
  if(G.cooker){G.cooker.t-=dt;if(G.cooker.t<=0){G.ready.rice_cooked+=G.cooker.n;fx(ST.rice.x,ST.rice.y-40,'白飯好了','#3f8f5a');G.cooker=null}}
  // 食材備齊 → 組成一份放到切好區
  {let n=trayItems().length;R.waitMsg=null;
   for(const t of R.tickets){if(t.st!=='prepQ')continue;const req=DMAP[t.dish].req;
     if(n<TRAY_MAX&&req.every(k=>have(k)>0)){req.forEach(k=>{if(k==='sauce')G.bench['調味']--;else G.ready[k]--});t.st='cut';t.res=null;t.q.push(clamp(G.pq,5,100));n++}
     else if(!R.waitMsg)R.waitMsg=n>=TRAY_MAX?'切好區滿了，快拿去爐具':DMAP[t.dish].short+' 還缺：'+req.filter(k=>have(k)<=0).map(k=>ITEM[k].n).join('、');}}
  // 爐具
  for(const st of STOVES){ if(!owned(st)||PWR||R.ev.broken===st)continue;
    const t=headTicket(st); if(!t)continue;
    const fin=t.si===t.steps.length-1;
    if(t.prog>=1){ if(fin)tryFinish(t); continue;}
    const ws=stationWorkers(st); if(!ws.length)continue;
    const sp=ws.reduce((a,w)=>a+workerFactor(w.p,st,w.boss),0)*STOVE_SPD[G.stoveLv[st]];
    t.prog+=dt/5*sp; R.used.add(st);
    if(t.prog>=1){
      const best=ws.reduce((a,w)=>w.p.abil[st]>a.p.abil[st]?w:a,ws[0]);
      if(Math.random()<errChance(best.p,st,best.boss)){t.prog=0;fx(ST[st].x,ST[st].y-40,'失誤！','#b8352a');R.fx.push({x:ST[st].x,y:ST[st].y-20,img:'smoke',t:1});continue}
      t.q.push(clamp(best.p.abil[st]+(G.stoveLv[st]-1)*6,5,100));
      ws.forEach(w=>grow(w.p,st));
      if(fin)tryFinish(t); else {t.st='moving';t.mt=0;t.from=st;t.si++;t.prog=0;}
    }
  }
  for(const t of R.tickets){ if(t.st==='moving'){t.mt+=dt/1.4; if(t.mt>=1)t.st='queued';} }
  // 洗碗
  const cw=stationWorkers('sink');
  if(R.sinkDirty>0&&cw.length&&!PWR&&!WTR){R.washP=(R.washP||0)+dt/2.2*cw.reduce((a,w)=>a+workerFactor(w.p,'clean',w.boss),0);
    while(R.washP>=1&&R.sinkDirty>0){R.washP--;R.sinkDirty--;G.plates++;cw.forEach(w=>grow(w.p,'clean',.25))}}
  dogUpdate(dt);
  // 客人
  for(const c of R.cust) custUpdate(c,dt);
  R.cust=R.cust.filter(c=>!(c.st==='gone'));
  // 緊急叫貨
  if(R.orders.length){for(const o of R.orders){o.t-=dt;if(o.t<=0){G.stock[o.k]+=5;toast(o.k+' 到貨 +5')}} R.orders=R.orders.filter(o=>o.t>0)}
  R.fx.forEach(f=>{f.t-=dt;f.y-=dt*22});R.fx=R.fx.filter(f=>f.t>0);
  if(R.t>=R.dur)endMeal();
}
/* 店寵：在用餐區亂逛，碰到客人隨機加或減耐心 */
const DOG_LIKE={office:.6,family:.8,foodie:.5};
function custSpots(c){
  if(['order','wait','eat'].includes(c.st)){const t=R.tables[c.table],pos=[[-34,-18],[34,-18],[-34,22],[34,22]];return c.heads.map((h,i)=>({x:t.x+pos[i][0],y:t.y+pos[i][1]}))}
  if(c.st==='gone'||c.st==='leave')return [];
  return [{x:c.x,y:c.y}];
}
function dogUpdate(dt){
  const d=R.dog;
  if(d.wait>0){d.wait-=dt}
  else{const ox=d.x; if(walk(d,{x:d.tx,y:d.ty},55,dt)){d.wait=rnd(1.5,4);d.tx=rnd(40,570);d.ty=rnd(240,620)} if(Math.abs(d.x-ox)>.01)d.face=d.x>ox?1:-1}
  if(d.react){d.react.t-=dt;if(d.react.t<=0)d.react=null}
  for(const c of R.cust){
    if(!['queue','order','wait','eat','toPay','pay'].includes(c.st))continue;
    if((c.dogCd||0)>R.t)continue;
    if(!custSpots(c).some(p=>Math.hypot(p.x-d.x,p.y-d.y)<26))continue;
    c.dogCd=R.t+10;
    const like=Math.random()<DOG_LIKE[c.type];
    if(c.st==='eat'){if(like){c.dogBonus=(c.dogBonus||0)+.15}else{c.dogBonus=(c.dogBonus||0)-.15}}
    else{const v=c.patMax*(like?.18:-.18);c.pat=clamp(c.pat+v,1,c.patMax)}
    d.react={t:1.6,like}; fx(d.x,d.y-24,like?'好可愛 ♥':'怕狗…','#'+(like?'3f8f5a':'b8352a'));
    if(like){d.wait=1.2;d.tx=d.x;d.ty=d.y}
    else{d.wait=0;d.tx=clamp(d.x+rnd(-160,160),40,570);d.ty=clamp(d.y+rnd(-80,80),240,620)}
    break;
  }
}
const trayItems=()=>R.tickets.filter(t=>t.st==='cut');
function pickTray(s){
  let items=trayItems().filter(t=>!t.res); if(R.claims.has('tray'))items=items.slice(1);
  if(!items.length)return null;
  if(s.role==='prep'){const busy=PREP.some(canJob)&&trayItems().length<TRAY_MAX;return (!busy&&s.rt.slot>=0)?items[0]:null}
  if(s.rt.slot!==0||headTicket(s.role))return null;
  return items.find(t=>t.steps[0]===s.role)||items.find(t=>!G.staff.some(x=>x.role===t.steps[0]&&x.stam>0))||null;
}
function carrierAI(s,dt){
  const rt=s.rt;
  if(rt.carry&&rt.carry.st==='cutCarry'){const t=rt.carry;
    if(t.cancel){rt.carry=null;R.tickets=R.tickets.filter(x=>x!==t);return false}
    const sp=SPOTS[t.steps[0]]; if(walk(rt,{x:sp.x+20,y:sp.y+30},135,dt)){t.st='queued';t.res=null;rt.carry=null} return true}
  if(rt.fetch){const t=rt.fetch; if(t.res!==s||t.st!=='cut'){rt.fetch=null;return false}
    if(walk(rt,{x:SPOTS.tray.x+[-30,30,0][s.id%3],y:SPOTS.tray.y+26},135,dt)){t.st='cutCarry';rt.carry=t;rt.fetch=null} return true}
  return false;
}
function tryFinish(t){
  if(R.combo&&R.combo.wokServe&&t.steps[t.steps.length-1]==='wok'&&G.plates>0&&t.c&&['wait','order'].includes(t.c.st)&&!TUT){
    G.plates--;t.stall=null;const tb=R.tables[t.c.table];fx(tb.x,tb.y-60,'✨ 出菜即送','#c2412d');deliver(t);return}
  if(G.plates<=0){t.stall='缺盤';return}
  if(R.pass.length>=4){t.stall='出餐台滿';return}
  t.stall=null;G.plates--;t.st='ready';R.pass.push(t);
}
function walk(o,tg,sp,dt){const dx=tg.x-o.x,dy=tg.y-o.y,d=Math.hypot(dx,dy);if(d<4)return true;const s=Math.min(d,sp*dt);o.x+=dx/d*s;o.y+=dy/d*s;return d<6}

function custUpdate(c,dt){
  if(c.tut)c.pat=c.patMax;
  const pm=patMul();
  if(c.st==='queue'){
    const i=R.cust.filter(x=>x.st==='queue').indexOf(c);
    walk(c,{x:50+(i%5)*36,y:612-Math.floor(i/5)*30},140,dt);
    c.pat-=dt/pm; if(c.pat<=0){c.st='leave';R.lost++;if(c.inf){addReview(1,8,'網紅：排隊排到走人');toast('網紅等不及走了，負評開始擴散',3)}fx(c.x,c.y,'不等了','#d08a24');return}
    const ti=R.tables.findIndex(t=>!t.c&&t.dirty===0);
    if(ti>=0&&i===0){c.table=ti;R.tables[ti].c=c;c.st='walkIn'}
  } else if(c.st==='walkIn'){
    if(walk(c,R.tables[c.table],150,dt)){c.st='order';c.seatT=R.t;c.patMax=c.pat=CTYPE[c.type].pat*.7*pm;}
  } else if(c.st==='order'||c.st==='wait'){
    c.pat-=dt; if(c.pat<=0)leaveAngry(c,c.st==='order'?'沒人來點餐':'等太久了');
  } else if(c.st==='eat'){
    c.eatT-=dt; if(c.eatT<=0){const t=R.tables[c.table];t.dirty+=c.dishes.length;t.c=null;c.st='toPay';R.payQ.push(c)}
  } else if(c.st==='toPay'||c.st==='pay'){
    const i=R.payQ.indexOf(c); if(walk(c,{x:ST.cash.x-i*32,y:ST.cash.y+72},150,dt))c.st='pay';
  } else if(c.st==='leave'){
    if(walk(c,DOOR,170,dt))c.st='gone';
  }
}
function settlePay(c,opt){
  if(!opt&&R.ev&&R.ev.wallet&&R.t<R.dur&&!R.battle){R.ev.wallet=false;
    evBox('👛 客人忘帶錢包','結帳時客人一臉尷尬：錢包忘在家裡了。',[
      {t:'算了，放他走（他可能會回來付）',f(){settlePay(c,'free')}},{t:'扣押手機，回去拿錢（他可能給一星）',f(){settlePay(c,'phone')}}],true);return}
  R.payQ=R.payQ.filter(x=>x!==c);
  // 隱藏的菜色熟練度：同一道菜做越多次，客人願意多花一點（最多 +30%，不在畫面上顯示）
  const mBonus=id=>masteryBonus(((G.mastery||{})[id])||0);
  let sum=Math.round(c.dishes.reduce((s,id)=>s+G.prices[id]*(1+mBonus(id)),0))+(c.side||0);
  const back=opt==='free'&&Math.random()<.5, mad=opt==='phone'&&Math.random()<.4;
  if(opt==='free'&&!back)sum=0;
  if(back)setTimeout(()=>toast('剛剛忘帶錢包的客人跑回來把錢付清了！',3),400);
  const ct=CTYPE[c.type];
  const q=c.qs.reduce((a,b)=>a+b,0)/c.qs.length;
  const pr=c.dishes.reduce((s,id)=>s+G.prices[id]/DMAP[id].ref,0)/c.dishes.length;
  let s=3+(c.patLeft+(c.dogBonus||0)-.35)*2.2+(q-55)/22*(c.type==='foodie'?1.6:1)-Math.max(0,pr-1.1)*ct.sens*2*(promoHigh()?.5:1);
  s=clamp(Math.round(s),1,5);
  if(opt==='free')s=5; else if(mad)s=1;
  let tip=0; if(s>=5&&Math.random()<.5)tip=Math.round(sum*.1);
  R.rev+=sum; R.tips+=tip; R.served++; G.today.served++; G.today.rev+=sum+tip; c.dishes.forEach(d=>G.today.dish[d]=(G.today.dish[d]||0)+1);
  fx(ST.cash.x,ST.cash.y-30,'+'+(sum+tip),'#3f8f5a');
  const txt=s>=5?pick(['好吃到想再來','跟阿嬤做的味道一樣','上菜好快']):s>=4?pick(['不錯吃','價錢合理']):s>=3?pick(['普普','還可以']):pick(['等有點久','有點貴','味道普通']);
  addReview(s,ct.w,opt==='free'?'老闆人超好，下次一定來':mad?'扣我手機，當我是小偷':txt);
  if(c.inf){if(s>=4){addReview(5,8,'網紅大推：必吃老店');toast('網紅發文大推！評價大漲',3)}else{addReview(1,6,'網紅：普普通通');toast('網紅不太滿意…',3)}}
  if(s>=5)R.fx.push({x:ST.cash.x,y:ST.cash.y+40,img:'perfect',t:1.4});
  c.st='leave';
}
// 熟練度加價：600 份前慢慢升到 +30%；之後每多一倍份數再往上一階，最高 +500%
const M_STEPS=[.3,.6,1,1.6,2.5,3.6,5]; // 600、1200、2400、4800、9600、19200、38400 份
function masteryBonus(m){
  if(m<=600)return .3*(1-Math.exp(-m/300))/(1-Math.exp(-2));
  const x=Math.log2(m/600),i=Math.floor(x);if(i>=M_STEPS.length-1)return M_STEPS[M_STEPS.length-1];
  return M_STEPS[i]+(M_STEPS[i+1]-M_STEPS[i])*(x-i);
}
function deliver(t){
  const c=t.c; c.servedN++;
  if(!TUT&&!R.battle){G.mastery=G.mastery||{};G.mastery[t.dish]=(G.mastery[t.dish]||0)+1} c.qs=(c.qs||[]); c.qs.push(t.q.reduce((a,b)=>a+b,0)/t.q.length+((G.dishQ||{})[t.dish]||0));
  R.tickets=R.tickets.filter(x=>x!==t);
  if(c.servedN>=c.dishes.length){c.st='eat';c.eatT=rnd(7,10);c.patLeft=c.pat/c.patMax}
}

/* 外場 AI */
function pickPayer(){const ps=R.payQ.filter(c=>c.st==='pay').slice(0,2);return ps.find(c=>!c.handler&&!(R.claims.has('cash')&&c===ps[0]))}
function floorAI(s,dt){
  const rt=s.rt, cl=R.claims; let T=rt.task;
  if(!T){
    const payer=pickPayer();
    if(payer){payer.handler=s;T={k:'cash',c:payer}}

function bossAct(dt,b,sp,B){
  b.act=null;
  const wf=k=>workerFactor(B,k,true);
  // 出餐台拿菜：老闆優先，員工若還在路上就讓給老闆
  if(!b.carry&&sp==='pass'&&R.pass.length){
    const t=R.pass.find(x=>!x.res)||R.pass[0];
    if(t.res){const o=t.res;if(o.rt.task&&o.rt.task.t===t)o.rt.task=null;t.res=null}
    R.pass=R.pass.filter(x=>x!==t);t.st='carried';b.carry=t;}
  // 端菜
  // 食材架拿一籃 → 放到備料區
  if(!b.carry&&sp==='shelf'&&!b.shelfCd){let k=neededIng();
    if(!k){const menuIng=[...new Set(G.menu.flatMap(id=>DMAP[id].ing))].filter(x=>G.stock[x]>0&&G.bench[x]<(x==='米麵'?15:6)).sort((x,y)=>G.bench[x]-G.bench[y]);k=menuIng[0]}
    if(k){const n=Math.min(G.stock[k],basketN(B));G.stock[k]-=n;b.carry={basket:k,n};grow(B,'buy')}
    else{fx(SPOTS.shelf.x,SPOTS.shelf.y-60,'備料區夠用了','#6b5d50')}
    b.shelfCd=true}
  if(sp!=='shelf')b.shelfCd=false;
  if(b.carry&&b.carry.basket&&PREP.includes(sp)){const {basket:k,n}=b.carry;G.bench[k]+=n;fx(ST[sp].x,ST[sp].y-30,k+' +'+n,'#3f8f5a');b.carry=null}
  // 切好區拿食材 → 放到對應爐具
  if(!b.carry&&sp==='tray'){const its=trayItems();const t=its.find(x=>!x.res)||its[0];
    if(t){if(t.res){const o=t.res;if(o.rt.fetch===t)o.rt.fetch=null;t.res=null}t.st='cutCarry';t.res=null;b.carry=t}}
  if(b.carry&&b.carry.st==='cutCarry'){const t=b.carry;
    if(t.cancel){R.tickets=R.tickets.filter(x=>x!==t);b.carry=null}
    else if(sp===t.steps[0]){t.st='queued';b.carry=null;fx(ST[sp].x,ST[sp].y-40,'放好了','#3f8f5a')}}
  if(b.carry&&b.carry.st==='carried'){const t=b.carry;
    if(t.cancel){R.tickets=R.tickets.filter(x=>x!==t);R.sinkDirty++;b.carry=null}
    else{const tb=R.tables[t.c.table];if(dist(b,tb)<62){deliver(t);grow(B,'serve');b.carry=null}}}
  // 髒盤丟水槽
  if(b.carry&&b.carry.dirty&&sp==='sink'){R.sinkDirty+=b.carry.dirty;b.carry=null}
  if(b.carry){b.actT=0;return}
  const kick=(o,pt)=>{if(o&&dist(o.rt,pt)>66){o.rt.task=null;return true}return false};
  if(sp&&/^t\d$/.test(sp)){const tb=R.tables[+sp.slice(1)];
    if(tb.c&&tb.c.st==='order'){if(kick(tb.res,tb))tb.res=null;
      tb.op+=dt/2.2*wf('order');b.act={x:tb.x,y:tb.y-58};b.actT=tb.op;
      if(tb.op>=1){tb.op=0;takeOrder(tb.c);grow(B,'order');if(tb.res){tb.res.rt.task=null;tb.res=null}}return}
    if(!tb.c&&tb.dirty>0){if(kick(tb.res,tb))tb.res=null;
      tb.bp+=dt*wf('bus');b.act={x:tb.x,y:tb.y-58};b.actT=tb.bp;
      if(tb.bp>=1){tb.bp=0;b.carry={dirty:tb.dirty};tb.dirty=0;grow(B,'bus');if(tb.res){tb.res.rt.task=null;tb.res=null}}return}
  }
  if(sp==='cash'){const c=R.payQ.find(x=>x.st==='pay');
    if(c){if(c.handler&&kick(c.handler,ST.cash))c.handler=null;
      c.pp=(c.pp||0)+dt/2.2*wf('cash');b.act={x:ST.cash.x,y:ST.cash.y-52};b.actT=c.pp;
      if(c.pp>=1)settlePay(c),grow(B,'cash');return}}
  if(PREP.includes(sp)){const S=R.ps[sp];if(S.job){b.act={x:ST[sp].x,y:ST[sp].y-62};b.actT=S.p}}
  else if(sp&&STOVES.includes(sp)){const h=headTicket(sp);if(h&&h.prog<1){b.act={x:ST[sp].x,y:ST[sp].y-62};b.actT=h.prog}}
  else if(sp==='sink'&&R.sinkDirty>0){b.act={x:ST.sink.x,y:ST.sink.y-62};b.actT=R.washP||0}
  if(!b.act)b.actT=0;
}

function endMeal(){
  if(R.battle){battleEnd();return}
  paused=true;
  for(const c of R.cust){
    if(c.st==='order'||c.st==='wait'){R.comp+=60*c.party;R.angry++;G.plates+=c.servedN;addReview(2,CTYPE[c.type].w,'打烊了還沒上菜')}
    else if(c.st==='eat'){G.plates+=c.dishes.length;c.patLeft=c.patLeft??.5;settlePay(c)}
    else if(c.st==='toPay'||c.st==='pay'){c.patLeft=c.patLeft??.5;c.qs=c.qs||[60];settlePay(c)}
  }
  // 盤子回收
  R.tables.forEach(t=>{G.plates+=t.dirty});G.plates+=R.sinkDirty+R.pass.length;
  R.tickets.forEach(t=>{if(t.st==='carried')G.plates++});
  if(R.boss.carry&&R.boss.carry.dirty)G.plates+=R.boss.carry.dirty;
  G.staff.forEach(s=>{if(s.rt&&s.rt.carry&&s.rt.carry.dirty)G.plates+=s.rt.carry.dirty;if(s.rt&&s.rt.carry&&s.rt.carry.basket)G.bench[s.rt.carry.basket]+=s.rt.carry.n});
  if(R.boss.carry&&R.boss.carry.basket)G.bench[R.boss.carry.basket]+=R.boss.carry.n;
  G.lastDirty=R.sinkDirty+R.tables.reduce((a,t)=>a+t.dirty,0);
  const util=[...R.used].reduce((a,st)=>a+40+20*G.stoveLv[st],0);
  const working=G.staff.filter(s=>s.role!=='rest');
  const sal=working.reduce((a,s)=>a+salary(s),0);
  // 心情體力
  const notes=[];
  for(const s of G.staff){
    const neg=v=>v*(s.traits.includes('樂天')?.5:s.traits.includes('玻璃心')?1.5:1);
    if(s.role==='rest'){s.stam=Math.min(100,s.stam+20);s.mood=Math.min(100,s.mood+4);continue}
    const key=s.role==='floor'?'serve':s.role;
    if(s.abil[key]<30)s.mood-=neg(5);
    if(s.stam<20)s.mood-=neg(5);
    if(R.angry>=2)s.mood-=neg(3);
    if(s.stam<=0)notes.push(s.name+' 累倒了');
    s.mood=clamp(s.mood,0,100);
  }
  relAfterMeal(notes);
  G.staff.forEach(s=>{if(s.backRole){s.role=s.backRole;delete s.backRole}});
  const res={rev:R.rev+R.tips,comp:R.comp,util,sal,served:R.served,angry:R.angry,lost:R.lost,reviews:R.newReviews.slice(-6),notes};
  G.cash+=res.rev-res.comp-util-sal; G.weekRev+=res.rev;
  // 辭職
  const quit=G.staff.filter(s=>s.mood<=0);G.staff=G.staff.filter(s=>s.mood>0);quit.forEach(s=>{notes.push(s.name+' 心情跌到谷底，離職了');friendsLeave(s,notes)});
  const wasMeal=G.meal;
  G.meal++;
  if(G.meal>2){G.meal=0;dayEnd(res,notes)} else {res.title=MEALS[wasMeal]+'結束';showBetween(res,false)}
  G.tutorial=false;
}
const DEBT_RATE=.002; // 負債週利率 0.2%（原本 0.5%）
function dayEnd(res,notes){
  if((G.branches||[]).length){const bd=branchDay();res.branch=bd.sum;res.notes=(res.notes||[]).concat(bd.notes)}
  G.today={served:0,rev:0,dish:{}};
  G.staff.forEach(s=>{s.stam=Math.min(100,s.stam+30)});
  rollPool();
  res.title='第 '+G.day+' 天打烊';
  const weekEnd=G.day%7===0;

  if(weekEnd)return weekSettle(res);

}
function weekSettle(res){
  const tax=Math.round(G.weekRev*.05), intr=Math.round(G.debt*DEBT_RATE);
  G.cash-=tax+intr; G.staff.forEach(s=>s.mood=Math.min(100,s.mood+3));
  res.week={tax,intr,rev:G.weekRev};G.weekRev=0;G.week++;
  if(G.cash<0)return gameOver('週結算付不出稅金與利息，阿嬤的老店被法拍了。');
  if(G.week>32&&G.debt>0)return gameOver('32 週期限到了，負債還沒還清，老店被收回。');
  showBetween(res,true);
}

  if(s.rt.carry&&s.rt.carry.st==='cutCarry'){const t=s.rt.carry;t.res=null;s.rt.carry=null;if(t.cancel)R.tickets=R.tickets.filter(x=>x!==t);else t.st='cut'}
  if(s.rt.carry){if(s.rt.carry.dirty)R.sinkDirty+=s.rt.carry.dirty;if(s.rt.carry.dish){const t=s.rt.carry;t.st='ready';t.res=null;R.pass.push(t)}s.rt.carry=null}

}

// 做出跟 Claude 房間一樣的介面：presence() / peers() / leave()
function p2pRoom(peer){
  let mine={},theirs=null,conn=null;
  const nr={
    presence:async p=>{for(const k in p){if(p[k]===null)delete mine[k];else mine[k]=p[k]}if(conn&&conn.open)try{conn.send(mine)}catch(e){}},
    peers:()=>[{sameTab:true,presence:mine},...(theirs?[{sameTab:false,presence:theirs}]:[])],
    leave:async()=>{try{peer.destroy()}catch(e){}},
    attach(c){conn=c;c.on('data',d=>{if(d&&typeof d==='object')theirs=d});c.on('open',()=>{try{c.send(mine)}catch(e){}});c.on('close',()=>{if(conn===c){theirs=null;conn=null}})}};
  return nr;
}
function p2pHost(code){return new Promise((ok,no)=>{
  const peer=new Peer('zaoka-'+code.toLowerCase(),PEER_OPT),nr=p2pRoom(peer);
  peer.on('open',()=>ok(nr));
  peer.on('connection',c=>nr.attach(c));
  peer.on('disconnected',()=>{try{peer.reconnect()}catch(e){}});
  peer.on('error',e=>no(e&&e.type||'error'));
  setTimeout(()=>no('timeout'),10000)})}
function p2pJoin(code){return new Promise((ok,no)=>{
  const peer=new Peer(undefined,PEER_OPT),nr=p2pRoom(peer);
  peer.on('open',()=>{const c=peer.connect('zaoka-'+code.toLowerCase(),{serialization:'json',reliable:true});nr.attach(c);c.on('open',()=>ok(nr))});
  peer.on('error',e=>no(e&&e.type||'error'));
  setTimeout(()=>no('timeout'),12000)})}

function estNet(x,own){const rev=x.tables*x.flow*520*CROWD[x.crowd].v*1.2*1.03*(1-x.rivals*.06);return Math.round((rev-(rev*.35+x.tables*260)-1000-(own?0:x.rent/7))/100)*100}
function branchDay(){
  const out=[];let sum=0;
  for(const b of (G.branches||[])){
    const m=b.mgr,P=POLICY[b.policy],sk=mgrSkill(m);
    let rev=b.tables*b.flow*520*CROWD[b.crowd].v*(.7+sk/100)*(.85+b.stars*.06)*P.r*(1-b.rivals*.06)*rnd(.85,1.15);
    if(b.defect==='pipe')rev*=.9;
    const crew=b.tables*260, cost=(rev*.35+crew)*P.c+salary(m)*3+(b.own?0:b.rent/7);
    let net=rev-cost, skim=0;
    if(m.traits.includes('愛錢')&&m.mood<50&&Math.random()<.3){skim=Math.round(rev*rnd(.05,.1));net-=skim}
    if(b.defect==='leak'&&G.day%7===0){net-=3000}
    if(b.defect&&!b.found&&Math.random()<.25){b.found=true;out.push(`⚠ ${b.name} 發現${DEFECT[b.defect].n}：${DEFECT[b.defect].d}`)}
    b.stars=clamp(b.stars+(P.s||0)+(sk-50)/2000-(b.defect==='smoke'?.03:0)+rnd(-.03,.03),1,5);
    m.mood=clamp(m.mood+P.m+rnd(-2,2),0,100);

    net=Math.round(net);b.last={rev:Math.round(rev),net,skim};sum+=net;G.cash+=net;
  }
  G.branches=(G.branches||[]).filter(b=>{if(!b.mgr){G.cash+=b.deposit||0;return false}return true});
  return {sum,notes:out};
}

const rk=(a,b)=>a.id<b.id?a.id+'-'+b.id:b.id+'-'+a.id;

const CLASH=[['勤勞','愛偷懶'],['天生快手','慢慢來']];
const clash=(a,b)=>CLASH.some(([x,y])=>a.traits.includes(x)&&b.traits.includes(y)||a.traits.includes(y)&&b.traits.includes(x));
const KITCH_ROLES=['boil','wok','steam','fry','prep'];
// 連攜技：好朋友＋同一場上班＋崗位搭配
const COMBOS=[
 {id:'wokServe',n:'出菜即送',d:'炒好的菜直接送到客人桌上',m:(a,b)=>a==='wok'&&b==='floor'},
 {id:'busSink',n:'碗盤直送水槽',d:'客人走後髒盤子自動送進水槽',m:(a,b)=>a==='floor'&&b==='clean'},
 {id:'plateHand',n:'乾淨盤子遞到手',d:'洗碗速度 +40%',m:(a,b)=>a==='clean'&&KITCH_ROLES.includes(b)},
 {id:'boilWok',n:'合菜同時上齊',d:'煮、炒速度 +20%',m:(a,b)=>a==='boil'&&b==='wok'},
 {id:'steamFry',n:'點心套餐加速',d:'蒸、炸速度 +20%',m:(a,b)=>a==='steam'&&b==='fry'},
 {id:'fastPay',n:'吃完立刻結帳',d:'兩人都在外場：結帳速度加倍',m:(a,b)=>a==='floor'&&b==='floor'},
 {id:'stockFlow',n:'食材不斷',d:'備料區食材快用完會自動補上',m:(a,b)=>a==='stock'&&KITCH_ROLES.includes(b)},
 {id:'sameSpot',n:'同站默契',d:'同崗位速度 +25%',m:(a,b)=>a===b&&a!=='floor'&&a!=='rest'},
];
function findCombos(){
  const on=G.staff.filter(s=>s.role!=='rest'&&!(s.rt&&s.rt.brk)),out=[];
  for(let i=0;i<on.length;i++)for(let j=i+1;j<on.length;j++){const a=on[i],b=on[j];if(relOf(a,b)<60)continue;
    for(const c of COMBOS)if(c.m(a.role,b.role)||c.m(b.role,a.role)){if(!out.some(o=>o.id===c.id))out.push({...c,who:a.name+'＋'+b.name})}}
  return out;
}
function comboSetup(live){
  const before=Object.keys(R.combo||{});
  R.combo={};R.cmul={};const cs=findCombos();
  for(const c of cs){R.combo[c.id]=c;
    if(c.id==='plateHand')R.cmul.clean=1.4;
    if(c.id==='boilWok'){R.cmul.boil=1.2;R.cmul.wok=1.2}
    if(c.id==='steamFry'){R.cmul.steam=1.2;R.cmul.fry=1.2}
    if(c.id==='fastPay')R.cmul.cash=2;
    if(c.id==='sameSpot'){const on=G.staff.filter(s=>s.role!=='rest'&&!(s.rt&&s.rt.brk));for(let i=0;i<on.length;i++)for(let j=i+1;j<on.length;j++)
      if(on[i].role===on[j].role&&relOf(on[i],on[j])>=60){const k=on[i].role==='prep'?'prep':on[i].role==='clean'?'clean':on[i].role;R.cmul[k]=(R.cmul[k]||1)*1.25}}}
  if(TUT)return;
  if(!live){if(cs.length)setTimeout(()=>toast('✨ 連攜技：'+cs.map(c=>c.n).join('、'),3.5),600);return}
  // 營業中排班有變：重新判斷，排回原本的崗位就會再發動
  const add=cs.filter(c=>!before.includes(c.id)),lost=before.filter(id=>!R.combo[id]).map(id=>COMBOS.find(c=>c.id===id).n);
  if(add.length)toast('✨ 連攜技發動：'+add.map(c=>c.n).join('、'),3);
  else if(lost.length)toast('連攜技暫停：'+lost.join('、')+'（排回原本的崗位就會恢復）',3);

function relAfterMeal(notes){
  const on=G.staff.filter(s=>s.role!=='rest');
  for(let i=0;i<on.length;i++)for(let j=i+1;j<on.length;j++){const a=on[i],b=on[j],c=clash(a,b);
    const v0=relOf(a,b);relAdd(a,b,c?-3:(a.traits.includes('樂天')||b.traits.includes('樂天')?5:4));
    const v=relOf(a,b);
    if(v0<60&&v>=60)notes.push('💛 '+a.name+'和'+b.name+'變成好朋友了！排在同一場、崗位搭得上會發動連攜技');
    if(v0>-30&&v<=-30)notes.push('⚡ '+a.name+'和'+b.name+'處不來，同一場上班心情會變差');
    if(v>=60){a.mood=Math.min(100,a.mood+3);b.mood=Math.min(100,b.mood+3)}
    else if(v<=-30){a.mood=Math.max(0,a.mood-3);b.mood=Math.max(0,b.mood-3)}}
}
// 有人離開：好朋友心情大掉，感情太好的可能一起走

  const out=[];

function battleTick(dt){
  const B=R.battle;
  B.deb.water=Math.max(0,B.deb.water-dt);B.deb.power=Math.max(0,B.deb.power-dt);
  B.next-=dt;
  if(B.next<=0){B.next=R.t>90?rnd(7,11):rnd(13,18);
    const me=bscore().score, lead=Math.max(0,...opponents().map(o=>o.score));
    const atk=MR()<(lead>me?.8:.6), pool=Object.keys(BT_ITEMS).filter(k=>!!BT_ITEMS[k].atk===atk);
    B.items.push({k:pool[Math.floor(MR()*pool.length)],x:60+MR()*500,y:250+MR()*350,t:16});}
  B.items.forEach(it=>it.t-=dt);B.items=B.items.filter(it=>it.t>0);
  const hit=B.items.find(it=>dist(R.boss,it)<32);
  if(hit){B.items=B.items.filter(x=>x!==hit);useItem(hit.k)}
  if(BT.nr){B.push-=dt;if(B.push<=0){B.push=.5;pushBattle('play')}readAttacks()}
  B.recT-=dt;if(B.recT<=0){B.recT=3;B.rec.sc.push(bscore().score)}
  if(BT.ghost){const g=BT.ghost;while(g.ai<g.a.length&&g.a[g.ai][0]<=R.t){receiveAttack(g.a[g.ai][1],g.n);g.ai++}}
  if(BT.ai){const A=BT.ai;A.slow=Math.max(0,A.slow-dt);A.score+=dt*(4+MR()*4)*(A.slow>0?.3:1);
    A.next-=dt;if(A.next<=0){A.next=25+MR()*25;const ks=['water','power','roach','troll'];receiveAttack(ks[Math.floor(MR()*4)],'電腦老闆')}}
}

function useItem(k){
  const it=BT_ITEMS[k],B=R.battle,b=R.boss;
  if(!it.atk){if(k==='magnet'){R.spawns.push(R.t+.3,R.t+1.5,R.t+3);R.spawns.sort((a,c)=>a-c)}else B.deb.shield++;

  const ops=opponents().filter(o=>!o.done);
  if(!ops.length){fx(b.x,b.y-60,'沒有對手可以攻擊','#6b5d50');return}
  const tg=ops.sort((a,c)=>c.score-a.score)[0];
  R.battle.rec.a.push([Math.round(R.t*10)/10,k]);
  if(tg.peer==='ghost'){BT.ghost.pen+={water:40,power:60,roach:60,troll:90}[k]}
  else if(tg.peer==='ai'){const A=BT.ai;if(A.shield){A.shield=0}else{A.score-= {water:40,power:60,roach:60,troll:90}[k];A.slow=k==='power'?6:k==='water'?10:3}}

}
function readAttacks(){
  const me=myPeer();if(!me)return;const B=R.battle;
  for(const p of BT.nr.peers()){if(p.sameTab||!p.presence||p.presence.mid!==BT.mid)continue;const list=Array.isArray(p.presence.atk)?p.presence.atk:[];
    const seen=B.seen[p.peer]||0;let mx=seen;
    for(const a of list){if(!a||typeof a.id!=='number'||a.id<=seen)continue;mx=Math.max(mx,a.id);if(a.to===me&&BT_ITEMS[a.k]&&BT_ITEMS[a.k].atk)receiveAttack(a.k,String(p.presence.name||'對手').slice(0,12))}
    B.seen[p.peer]=mx;}
}

}

    if(!waiting&&!BT.rewarded){BT.rewarded=true;BT.reward=tie?1500:rank===1?3000:800;if(BT.mainG){BT.mainG.cash+=BT.reward}}
    showOverlay(`<h1>${waiting?'等待其他人結束…':tie?'🤝 平手！':rank===1?'🏆 你贏了！':'第 '+rank+' 名'}</h1>
      <div class="stats"><div>你的綜合分<b>${fmt(BT.final)}</b></div><div>營收<b class="pos">${fmt(R.rev+R.tips)}</b></div><div>賠錢<b class="neg">${fmt(R.comp)}</b></div><div>平均星等<b>${fin.avg.toFixed(1)}</b></div><div>服務組數<b>${R.served}</b></div></div>
      <h2>排名</h2><div class="grid" id="btRank"></div>
      ${BT.rewarded?`<p class="pos">獎勵 ${fmt(BT.reward)} 元已經加到你的單機店裡。</p>`:''}
      ${!waiting?`<h2>把這場變成挑戰碼</h2><p class="small">複製後傳給朋友（LINE、IG 都可以），朋友在「對戰模式」貼上就能跟你這場的紀錄比。</p>
      <textarea id="btCodeOut" rows="3" readonly style="width:100%;box-sizing:border-box;font-size:12px;padding:8px;border-radius:8px;border:1px solid var(--line)">${esc(makeChal())}</textarea>
      <div class="row" style="justify-content:flex-start;margin-top:6px"><button class="btn" id="btCopy">複製挑戰碼</button></div>`:''}
      <div class="foot">${!waiting?`<button class="btn ghost" id="btHome">回到主畫面</button><button class="btn" id="btAgain">再來一場</button>`:''}</div>`,'battle');
    const L=$('btRank');all.forEach((p,i)=>{const d=document.createElement('div');d.className='box row';const n=document.createElement('b');n.textContent=(i+1)+'. '+p.name;
      const sc=document.createElement('span');sc.textContent=fmt(p.score)+(p.done?'':'（還在營業）');d.append(n,sc);L.append(d)});
    if(waiting){setTimeout(show,700);return}
    $('btHome').onclick=battleQuit;
    $('btCopy').onclick=()=>{const ta=$('btCodeOut');const ok=()=>toast('已複製，貼給朋友就可以了');
      try{navigator.clipboard.writeText(ta.value).then(ok,()=>{ta.focus();ta.select();toast('請長按或 Ctrl+C 複製選取的文字')})}catch(e){ta.focus();ta.select();toast('請長按或 Ctrl+C 複製選取的文字')}};
    $('btAgain').onclick=()=>{restoreMain();BT.started=false;BT.done=false;BT.ai=null;BT.ghost=null;if(BT.nr)BT.nr.presence({ph:'lobby',ready:false,atk:[]}).catch(()=>{});renderLobby()};
  };
  show();
}
function makeChal(){
  const B=R.battle,d={v:1,n:BT.name,s:B.seed,sc:B.rec.sc.slice(0,70),a:B.rec.a.slice(0,40),f:BT.final};
  try{return 'ZK1-'+btoa(unescape(encodeURIComponent(JSON.stringify(d))))}catch(e){return ''}
}
function decodeChal(txt){
  try{const m=String(txt||'').replace(/\s+/g,'').match(/ZK1-([A-Za-z0-9+/=]+)/);if(!m)return null;
    const d=JSON.parse(decodeURIComponent(escape(atob(m[1]))));
    const num=v=>Number.isFinite(+v)?+v:0;
    const sc=(Array.isArray(d.sc)?d.sc:[]).slice(0,70).map(v=>clamp(num(v),0,99999));
    const a=(Array.isArray(d.a)?d.a:[]).slice(0,40).filter(x=>Array.isArray(x)&&BT_ITEMS[x[1]]&&BT_ITEMS[x[1]].atk).map(x=>[clamp(num(x[0]),0,180),x[1]]).sort((p,q)=>p[0]-q[0]);
    return {n:String(d.n||'朋友').replace(/[<>]/g,'').slice(0,10)||'朋友',s:Math.floor(num(d.s))||1,sc,a,f:clamp(num(d.f),0,99999),pen:0,ai:0};
  }catch(e){return null}
}
function restoreMain(){Math.random=MR;if(BT&&BT.mainG){G=BT.mainG;BT.mainG=null;if(BT.rewarded)save()}R=null;paused=true}
function battleQuit(){paused2=false;$('bPause').textContent='暫停';restoreMain();battleLeave();BT=null;showTitle()}

/* ---------- 主迴圈 ---------- */
function loop(ts){
  requestAnimationFrame(loop); // 先排下一格：就算這一格出錯，畫面也不會整個停住
  try{frame(ts)}catch(e){console.error(e)}
}
function frame(ts){
  const dt=Math.min(.05,(ts-lastT)/1000||0);lastT=ts;
  if(isGuest()){coopGuestFrame(dt);if(R)draw();else drawIdle();if(R)hud();return}
  if(COOP&&COOP.role==='host')coopHostTick(dt);
  if(R&&!paused)update(dt);
  if(R)draw(); else drawIdle();
  hud();
  barT+=dt;if(barT>.5&&R&&!paused){barT=0;renderBar()}
}
function drawIdle(){const d=VIEW.d;ctx.setTransform(d,0,0,d,0,0);ctx.fillStyle='#2f4a43';ctx.fillRect(0,0,VIEW.cw,VIEW.ch);label('灶跤人生',VIEW.cw/2,VIEW.ch/2,'#d9a441',40,true)}
try{$('coinIc').src=ART_SRC.coins}catch(e){}
newGame();resize();showTitle();requestAnimationFrame(loop);
})();
</script>
